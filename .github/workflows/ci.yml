# MADETRUE — CI
# Runs on every push to main and on every pull request.
# Gates: ESLint (0 tolerated errors), type-check, production build.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs when new commits land on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node version is pinned in .nvmrc (currently 22) so CI and
      # teammates use the same line. cache: npm speeds up installs.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Exact, reproducible install from package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # Errors fail CI; warnings (dead imports, <img> tags) are reported but
      # tolerated so the gate stays meaningful without blocking on debt.
      - name: Lint
        run: npx eslint .

      # Note: in Next 16 `next build` does not run ESLint (that was removed);
      # a green build therefore guarantees compile + type safety via tsc above.
      - name: Build
        run: npm run build
